<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Autos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="alerta" class="alerta">
    <span id="mensajeAlerta"></span>
  </div>
  <div class="contenedor-principal">
    <header class="barra-superior">
      <div>
        <h1>Tabla de Autos</h1>
      </div>
    </header>
    <main class="panel-principal">
      <section class="tarjeta-voz efecto-vidrio">
        <div class="encabezado-voz">
          <h2>Inserta un nuevo auto</h2>
        </div>
        <button class="boton-microfono" id="botonMicrofono" type="button" aria-label="Activar micrófono">
          <span class="brillo-microfono"></span>
          <svg class="icono-microfono" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"/>
            <path d="M18.5 11a6.5 6.5 0 0 1-13 0M12 17.5V21M8.5 21h7"/>
          </svg>
          <span class="temporizador" id="temporizadorVoz"></span>
        </button>
        <div class="estado-voz" id="estadoVoz">Hablar</div>
      </section>
      <section class="tarjeta-autos efecto-vidrio">
        <div class="barra-tabla">
          <div>
            <h2>Autos registrados <span id="contadorAutos">0</span></h2>
          </div>
          <div class="acciones-tabla">
            <button class="boton-herramienta" id="botonActualizar" type="button" title="Actualizar lista">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8.1 8.1 0 0 0-14.9-4L3 10"/>
                <path d="M3 5v5h5M4 13a8.1 8.1 0 0 0 14.9 4L21 14"/>
                <path d="M21 19v-5h-5"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="desplazamiento-tabla">
          <table>
            <thead>
              <tr>
                <th>Marca</th>
                <th>Modelo</th>
                <th>
                  <button class="boton-precio" id="botonPrecio" type="button">
                    <span id="Precio">Precio</span>
                    <span class="icono-cambio">⇄</span>
                  </button>
                </th>
                <th class="columna-accion">Acción</th>
              </tr>
            </thead>
            <tbody id="TablaAutos"></tbody>
          </table>
          <div class="estado-vacio" id="estadoVacio">
            <strong>No hay vehículos registrados</strong>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
